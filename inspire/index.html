<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Panorama Inspire Demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
				
		<link rel="stylesheet" type="text/css" href="../dist/styles.min.css">
		<script src="../dist/app.min.js" defer></script>
		
		<script type="text/javascript" src="room1.js"></script>		
	</head>
	<body>

		<div id="container"></div>
		<div id="info_window">
			<div class="handle">	</div>
			<div id="info"></div>
			<video id="video" width="100%" height="auto" controls>
				<source id="mp4_src" src="vids/sp.mp4" type="video/mp4">
				
				Your browser does not support the video tag.
			</video>
			<div id="btns" class="hidden">
				<h5>Move</h5>
				<button class="btn btn-small" value='movex' onclick="Move('x', 5)">-x</button>
				<button class="btn btn-small" value='movex' onclick="Move('x', -5)">+x</button>
				<button class="btn btn-small" value='movey' onclick="Move('y', -5)">-y</button>
				<button class="btn btn-small" value='movey' onclick="Move('y', 5)">+y</button>
				<button class="btn btn-small" value='movez' onclick="Move('z', -5)">-z</button>
				<button class="btn btn-small" value='movez' onclick="Move('z', 5)">+z</button>						
			</div>
		</div>
		
		
		
	</body>
</html>
