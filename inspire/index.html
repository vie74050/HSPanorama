<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Panorama Inspire Demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
				
		<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.2.0/css/bootstrap.css" rel="stylesheet">
		<link href="../scripts/default.css" rel="stylesheet" type="text/css"/>

		<!-- jquery -->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
		<script src="https://code.jquery.com/ui/1.11.3/jquery-ui.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"></script>
						
		<!-- three libs --> 
		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r70/three.min.js" type="text/javascript"></script>
		
		<script src="../scripts/PanoWithClickObjs.js"></script>
		<script src="room1.js"></script>		
	</head>
	<body>

		<div id="container"></div>
		<div id="info_window">
			<div class="handle">	</div>
			<div id="info"></div>

			<div id="btns" class="hidden">
				<h5>Move</h5>
				<button class="btn btn-small" value='movex' onclick="Move('x', 5)">-x</button>
				<button class="btn btn-small" value='movex' onclick="Move('x', -5)">+x</button>
				<button class="btn btn-small" value='movey' onclick="Move('y', -5)">-y</button>
				<button class="btn btn-small" value='movey' onclick="Move('y', 5)">+y</button>
				<button class="btn btn-small" value='movez' onclick="Move('z', -5)">-z</button>
				<button class="btn btn-small" value='movez' onclick="Move('z', 5)">+z</button>						
			</div>
		</div>
		
		
		
	</body>
</html>
