<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Panorama Inspire Demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
				
		<link rel="stylesheet" type="text/css" href="../dist/styles.min.css">
		<script src="../dist/app.min.js" defer></script>
		
		<script type="text/javascript" src="room1.js"></script>		
	</head>
	<body>

		<div id="container"></div>
		<div id="info_window">
			<div class="handle">	</div>
			<div id="info"></div>
			<video id="video" width="100%" height="auto" controls controlsList="nodownload">
				<source id="mp4_src" src="vids/sp.mp4" type="video/mp4">
				Your browser does not support the video tag.
			</video>
			<!-- Helper buttons for positioning clickObjs. Remove or set class="hidden" when done.-->
			<div id="btns" class="well">
				<h5>Move Selected Object</h5>
				
				<button class="btn btn-small" value='movey' onclick="Move('y', -5)">
					&#8595; <!-- Down arrow symbol -->
				</button>
				<button class="btn btn-small" value='movey' onclick="Move('y', 5)">
					&#8593; <!-- Up arrow symbol -->
				</button>

				<button class="btn btn-small" value='rotate' onclick="MoveAroundY(-5)">
					&#8592; <!-- Left arrow symbol -->
				</button></button>
				<button class="btn btn-small" value='rotate' onclick="MoveAroundY(5)">
					&#8594; <!-- Right arrow symbol -->
				</button>

				<button class="btn btn-small" value='rotate' onclick="MoveCloser(5)">In</button>
				<button class="btn btn-small" value='rotate' onclick="MoveCloser(-5)">Out</button>
			</div>
		</div>
	
	</body>
</html>
