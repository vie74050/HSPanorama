<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Panorama Editor Tester</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
				
		<link rel="stylesheet" type="text/css" href="./default.css">
		<script src="./libs/three.min.js" defer></script>
		<script src="./PanoWithClickObjs.js" defer></script>

		<script type="text/javascript">
			const host = "./demo/";//"https://bcit-ltc.github.io/Inspire-Articulate360/story_content/";
			const panoImg = host + "demo.jpg";"5kAzXWsVisZ_full.jpg";

			/*  Sample implementation*/
			document.addEventListener('DOMContentLoaded', function () {
				
				const panoSphere = true;
				const panoFov = 60;
				const pano = new PanoViewer("container", "info_window", "video");
				const info_window = document.getElementById("info");

				pano.lon = 10, pano.lat = -10; pano.fov_init = 80;
				pano.Init(panoImg, panoSphere, panoFov);

				// detect when info_window loses focus
				info_window.addEventListener("blur", function() {
					if (info_window.contentEditable === "true") {
						SaveClickObj();
					}
				});

				window.Move = function(axis, delta=0.5) {
					pano.Move(axis, delta);
				};
				window.MoveAroundY = function(theta=0.5) {
					pano.MoveAroundY(theta);
				};
				window.MoveCloser = function(delta=0.5) {
					pano.MoveCloser(delta);
				};
				window.NewClickObj = function() {
					
					const defaultP = {
						description: "enter text here"
					}
					const newClickObj = pano.ClickObj(defaultP);
					newClickObj.children[0].material.color.setHex(0x00ff00); // green for new object
					newClickObj.children[0].material.opacity = 1;
				};
				window.DeleteClickObj = function() {
					if (!confirm("Are you sure you want to delete this hotspot?")) {
						return;
					}
					pano.DeleteClickObj();
				};
				window.SaveClickObj = function() {
					const obj = pano.OBJECTS.filter(o => o.id === pano.SELECTED.id)[0];
					const $info = document.getElementById('info');

					obj.description = $info.innerHTML;
					// make $info not contenteditable
					$info.contentEditable = false;
					$info.innerHTML = obj.description; console.log($info.innerHTML);

					//console.log(pano.OBJECTS);
				};
				window.EditClickObj = function() {
					const $info = document.getElementById('info');
					$info.contentEditable = true;
					$info.focus();
				};
				window.SaveAll = function() {
					if (pano.OBJECTS.length === 0) {
						alert("No hotspots to save.");
						return;
					}
					const objs = pano.OBJECTS.map(obj => {
						
						return {
							id: obj.id,
							description: obj.description,
							pos: { x: obj.position.x, y: obj.position.y, z: obj.position.z },
							type: obj.userData.type,
							size: { x: obj.scale.x, y: obj.scale.y, z: obj.scale.z }
						};
					});

					const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(objs, null, 2));
					const fileName = prompt("Enter file name to save:", "objects.json");
					if (fileName) {
						const downloadAnchorNode = document.createElement('a');
						downloadAnchorNode.setAttribute("href", dataStr);
						downloadAnchorNode.setAttribute("download", fileName);
						document.body.appendChild(downloadAnchorNode);
						downloadAnchorNode.click();
						downloadAnchorNode.remove();
				 }
				};
				window.LoadSavedJSON = function() {
					const input = document.createElement('input');
					input.type = 'file';
					input.accept = '.json,application/json';
					
					input.onchange = e => { 
						const file = e.target.files[0]; 
						const reader = new FileReader();
						reader.onload = event => { 
							const content = event.target.result;
							try {
								const objs = JSON.parse(content);
								objs.forEach(ob => {
									const newClickObj = pano.ClickObj(ob);
									newClickObj.children[0].material.color.setHex(0x00ff00); // green for new object
									newClickObj.children[0].material.opacity = 1;

								});
							} catch (err) {
								alert("Error parsing JSON: " + err.message);
							}
						};
						reader.readAsText(file);
					};
					
					input.click();
					
				};
				window.LoadImageFromFile = function(bool_sphere = true) {
					const input = document.createElement('input');
					input.type = 'file';
					input.accept = 'image/*';
					
					input.onchange = e => { 
						const file = e.target.files[0]; 
						const userImageURL = URL.createObjectURL(file);
						pano.SetPanoMaterial(userImageURL, bool_sphere);
						// revoke the object URL after image is loaded
						setTimeout(() => {
							URL.revokeObjectURL(userImageURL);
						}, 1000);
					};
					
					input.click();
				};
			});

		</script>
			
	</head>
	<body>
		<div id="editor">	
			<button class="btn btn-small" value='help' onclick="alert('Instructions:\n1. Load an 360 image for the background.\n2. Click and drag to move the panorama.\n3. Click ADD to add a new circle hotspot at the center of screen.\n4. Click on a hotspot to select it.\n  - Use the editing tools to adjust position and size. \n  - Click &#9998; EDIT  to modify the description. Click outside the text area to save.\n  - Click &#128465; DELETE to remove the selected hotspot. \n \n* Use DOWNLOAD to save all hotspots data as a JSON file.\n* Use LOAD to load hotspots data from a JSON file.')" title="Help">&#10067; HELP</button>
			|
			&#128247;
			<select class="btn btn-small" onchange="if(this.value==='sphere'){LoadImageFromFile(true);}else if(this.value==='cylinder'){LoadImageFromFile(false);} this.selectedIndex=0;">
				<option selected disabled>Load Pano Image</option>
				<option value="sphere">Spherical</option>
				<option value="cylinder">Cylindrical</option>
			</select>
			<button class="btn btn-small" value='add' onclick="NewClickObj()" title="Add a click spot at the center of the screen">&#9675; ADD</button>
			<button class="btn btn-small" value='saveall' onclick="SaveAll()" title="Download click spots data">&#128229; DOWNLOAD</button>
			<button class="btn btn-small" value='load' onclick="LoadSavedJSON()" title="Load saved data">&#128194; LOAD</button>
			<button class="btn btn-small" value='reset' onclick="if(confirm('All data will be lost. Are you sure you want to reset?')) location.reload()" title="Reset the panorama">&#10227; RESET</button>
			
		</div>
		<div id="container"></div>
		<div id="info_window">			
			<div class="handle"></div>
			<div id="info" placeholder="placeholder text"></div>
			<video id="video" width="100%" height="auto" controls controlsList="nodownload">
				<source id="mp4_src" src="" type="video/mp4">
				Your browser does not support the video tag.
			</video>			
			<div id="btns" class="well">
				<h5>Editing Tools</h5>
				<div class="flex-row">
					<button class="btn btn-small" value='movey' onclick="Move('y',-0.5)" title="Move Down">
						&#8595; <!-- Down arrow symbol -->
					</button>
					<button class="btn btn-small" value='movey' onclick="Move('y', 0.5)" title="Move Up">
						&#8593; <!-- Up arrow symbol -->
					</button>

					<button class="btn btn-small" value='rotate' onclick="MoveAroundY(-0.5)" title="Move Left">
						&#8592; <!-- Left arrow symbol -->
					</button>
					<button class="btn btn-small" value='rotate' onclick="MoveAroundY(0.5)" title="Move Right">
						&#8594; <!-- Right arrow symbol -->
					</button>

					<button class="btn btn-small" value='rotate' onclick="MoveCloser(0.5)" title="Larger">&#11044;</button>
					<button class="btn btn-small" value='rotate' onclick="MoveCloser(-0.5)" title="Smaller">&#x2022;</button>
					|
					<button class="btn btn-primary btn-lg" value='edit' onclick="EditClickObj()" title="Edit description">&#9998; </button>
					<button class="btn btn-danger btn-lg" value='delete' onclick="DeleteClickObj()" title="Delete Object">&#128465;</button>
				</div>
				

			</div>
		</div>
	
	</body>
</html>
